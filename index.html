<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IQ Questing — Quest Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #101010;
            overflow: hidden;
            font-family: monospace;
            color: #ccc;
        }

        #stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        canvas.quest {
            cursor: grab;
        }

        canvas.quest.dragging {
            cursor: grabbing;
        }

        #hud {
            position: fixed;
            left: 8px;
            bottom: 6px;
            font-size: 11px;
            color: #888;
            pointer-events: none;
            text-shadow: 0 1px 0 #000;
        }

        #err {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #ff8080;
            background: #101010;
            white-space: pre-wrap;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="stage">
        <canvas id="gui" width="854" height="480"></canvas>
    </div>
    <canvas id="quest" class="quest" width="16" height="16" style="display:none"></canvas>
    <div id="hud"></div>
    <pre id="err"></pre>
    <script src="app.js"></script>
</body>

</html>
